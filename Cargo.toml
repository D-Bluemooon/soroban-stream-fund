[package]
name = "soroban-stream-fund"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A minimal per-second token streaming contract for Soroban"
repository = "https://github.com/YOUR_ORG/soroban-stream-fund"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
